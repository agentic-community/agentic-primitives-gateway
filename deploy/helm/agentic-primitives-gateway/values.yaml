replicaCount: 1

image:
  repository: public.ecr.aws/ai-registry/agentic-primitives-gateway/gateway
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

# Server credential mode: never (caller only), fallback (server when caller absent),
# or always (operator only). Endpoint settings remain operator-owned in all modes.
allow_server_credentials: never

# Required for any Helm installation: choose jwt or api_key. Noop authentication
# grants every unauthenticated request admin access and is forbidden by this chart.
auth:
  backend: "" # jwt or api_key
  jwt:
    # Public OIDC settings, rendered into the ConfigMap. Both are required for jwt.
    issuer: ""
    audience: ""
    # jwks_url: "https://idp.example.com/realm/protocol/openid-connect/certs"
    # client_id: "gateway-ui"
  apiKey:
    # For api_key, supply an existing Kubernetes Secret containing a JSON list
    # of {"key":"...","principal_id":"..."} entries. Never put keys in values.
    existingSecret:
      name: ""
      key: api-keys.json

# Provider configuration — rendered into a ConfigMap.
# Each primitive supports multiple named backends with a default.
# Agents select a backend at request time via X-Provider-* headers.
providers:
  memory:
    default: "mem0"
    backends:
      mem0:
        backend: "agentic_primitives_gateway.primitives.memory.mem0_provider.Mem0MemoryProvider"
        config:
          vector_store:
            provider: milvus
            config:
              collection_name: agentic_memories
              url: "http://milvus:19530"
          llm:
            provider: aws_bedrock
            config:
              model: us.anthropic.claude-sonnet-4-20250514-v1:0
          embedder:
            provider: aws_bedrock
            config:
              model: amazon.titan-embed-text-v2:0
      in_memory:
        backend: "agentic_primitives_gateway.primitives.memory.in_memory.InMemoryProvider"
        config: {}
      # agentcore:
      #   backend: "agentic_primitives_gateway.primitives.memory.agentcore.AgentCoreMemoryProvider"
      #   config:
      #     region: "us-east-1"

  observability:
    default: "noop"
    backends:
      noop:
        backend: "agentic_primitives_gateway.primitives.observability.noop.NoopObservabilityProvider"
        config: {}
      # langfuse:
      #   backend: "agentic_primitives_gateway.primitives.observability.langfuse.LangfuseObservabilityProvider"
      #   config: {}
      # agentcore:
      #   backend: "agentic_primitives_gateway.primitives.observability.agentcore.AgentCoreObservabilityProvider"
      #   config:
      #     region: "us-east-1"

  identity:
    default: "noop"
    backends:
      noop:
        backend: "agentic_primitives_gateway.primitives.identity.noop.NoopIdentityProvider"
        config: {}
      # agentcore:
      #   backend: "agentic_primitives_gateway.primitives.identity.agentcore.AgentCoreIdentityProvider"
      #   config:
      #     region: "us-east-1"

  code_interpreter:
    default: "noop"
    backends:
      noop:
        backend: "agentic_primitives_gateway.primitives.code_interpreter.noop.NoopCodeInterpreterProvider"
        config: {}
      # agentcore:
      #   backend: "agentic_primitives_gateway.primitives.code_interpreter.agentcore.AgentCoreCodeInterpreterProvider"
      #   config:
      #     region: "us-east-1"

  browser:
    default: "noop"
    backends:
      noop:
        backend: "agentic_primitives_gateway.primitives.browser.noop.NoopBrowserProvider"
        config: {}
      # agentcore:
      #   backend: "agentic_primitives_gateway.primitives.browser.agentcore.AgentCoreBrowserProvider"
      #   config:
      #     region: "us-east-1"

  llm:
    default: "noop"
    backends:
      noop:
        backend: "agentic_primitives_gateway.primitives.llm.noop.NoopLLMProvider"
        config: {}

  tools:
    default: "noop"
    backends:
      noop:
        backend: "agentic_primitives_gateway.primitives.tools.noop.NoopToolsProvider"
        config: {}
      # agentcore:
      #   backend: "agentic_primitives_gateway.primitives.tools.agentcore.AgentCoreGatewayProvider"
      #   config:
      #     region: "us-east-1"
      # mcp_registry:
      #   backend: "agentic_primitives_gateway.primitives.tools.mcp_registry.MCPRegistryProvider"
      #   config:
      #     base_url: "http://mcp-registry:8080"
      #     verify_ssl: false
